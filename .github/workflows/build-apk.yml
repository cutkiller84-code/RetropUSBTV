name: Build RetroPUSBTV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android TV project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/retropusbtv
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          LOGO="a_stylized_neon_glow_futuristic_app_icon_logo_st.png"

          if [ -f "$LOGO" ]; then
            cp "$LOGO" app/src/main/res/drawable-nodpi/retropusbtv_logo.png
          else
            echo "Logo saknas. Skapar en enkel reservbild."
            python3 - <<'PY'
          import struct, zlib
          w = h = 128
          raw = b''.join(
              b'\x00' + bytes([15,18,30,255]) * w
              for _ in range(h)
          )
          def chunk(t, d):
              return struct.pack(">I",len(d))+t+d+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR',struct.pack(">2I5B",w,h,8,6,0,0,0))
          png += chunk(b'IDAT',zlib.compress(raw))
          png += chunk(b'IEND',b'')
          open("app/src/main/res/drawable-nodpi/retropusbtv_logo.png","wb").write(png)
          PY
          fi

          # Create Android launcher icons without external Python packages.
          python3 - <<'PY'
          import struct, zlib, os
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }
          for folder, size in sizes.items():
              raw = b''.join(
                  b'\x00' + bytes([15,18,30,255]) * size
                  for _ in range(size)
              )
              def chunk(t,d):
                  return struct.pack(">I",len(d))+t+d+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
              png = b'\x89PNG\r\n\x1a\n'
              png += chunk(b'IHDR',struct.pack(">2I5B",size,size,8,6,0,0,0))
              png += chunk(b'IDAT',zlib.compress(raw))
              png += chunk(b'IEND',b'')
              path = f"app/src/main/res/{folder}/ic_launcher.png"
              open(path,"wb").write(png)
          PY

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RetroPUSBTV"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.retropusbtv'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.retropusbtv'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.software.leanback"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.gamepad"
                  android:required="false" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="RetroPUSBTV"
                  android:icon="@mipmap/ic_launcher"
                  android:banner="@drawable/banner"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#52EBC2</item>
                  <item name="android:windowBackground">#0F121E</item>
                  <item name="android:navigationBarColor">#0F121E</item>
                  <item name="android:statusBarColor">#0F121E</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/banner.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#0F121E"/>
              <corners android:radius="8dp"/>
          </shape>
          EOF

          cat > app/src/main/java/com/retropusbtv/MainActivity.java <<'EOF'
          package com.retropusbtv;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.KeyEvent;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import java.util.ArrayList;

          public class MainActivity extends Activity {
              private final int BG = Color.rgb(15,18,30);
              private final int PANEL = Color.rgb(28,34,52);
              private final int MINT = Color.rgb(82,235,194);
              private final int WHITE = Color.WHITE;
              private final int MUTED = Color.rgb(165,176,196);

              private LinearLayout body;
              private final ArrayList<Uri> games = new ArrayList<>();
              private final ArrayList<String> gameNames = new ArrayList<>();
              private static final int PICK_GAMES = 101;
              private static final int PICK_FOLDER = 102;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);
                  showHome();
              }

              private int dp(float n) {
                  return (int)(n * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView text(String value, int size, int color) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER_VERTICAL);
                  return t;
              }

              private LinearLayout column() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  return l;
              }

              private void setup(String title, String subtitle) {
                  LinearLayout root = column();
                  root.setBackgroundColor(BG);
                  root.setPadding(dp(22), dp(16), dp(22), dp(14));

                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);

                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.retropusbtv_logo);
                  logo.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  header.addView(logo, new LinearLayout.LayoutParams(dp(64), dp(64)));

                  TextView brand = text("RETROPUSBTV", 24, MINT);
                  brand.setTypeface(null, Typeface.BOLD);
                  brand.setPadding(dp(12), 0, 0, 0);
                  header.addView(brand, new LinearLayout.LayoutParams(0, -2, 1));
                  root.addView(header);

                  TextView line = text(
                      "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━", 12, MINT);
                  root.addView(line);

                  TextView heading = text(title, 26, WHITE);
                  heading.setTypeface(null, Typeface.BOLD);
                  heading.setPadding(0, dp(10), 0, dp(2));
                  root.addView(heading);
                  TextView desc = text(subtitle, 14, MUTED);
                  desc.setPadding(0, 0, 0, dp(12));
                  root.addView(desc);

                  ScrollView scroll = new ScrollView(this);
                  body = column();
                  scroll.addView(body);
                  root.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1));

                  TextView footer = text(
                      "PIL UPP/NER • OK = VÄLJ • BACK = TILLBAKA", 11, MUTED);
                  root.addView(footer);
                  setContentView(root);
              }

              private void addButton(String label, Runnable action) {
                  TextView b = text(label, 18, WHITE);
                  b.setFocusable(true);
                  b.setClickable(true);
                  b.setPadding(dp(16), dp(13), dp(16), dp(13));
                  b.setBackgroundColor(PANEL);

                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(-1, -2);
                  p.bottomMargin = dp(8);
                  body.addView(b, p);

                  b.setOnFocusChangeListener((v, focused) -> {
                      b.setBackgroundColor(focused ? MINT : PANEL);
                      b.setTextColor(focused ? BG : WHITE);
                  });
                  b.setOnClickListener(v -> action.run());
              }

              private void addNote(String value) {
                  TextView t = text(value, 14, MUTED);
                  t.setPadding(dp(4), dp(8), dp(4), dp(8));
                  body.addView(t);
              }

              private void showHome() {
                  setup("Din spelkonsol", "Retrospel på TV:n — med din egen spelsamling");

                  addButton("🎮  SPELBIBLIOTEK", this::showLibrary);
                  addButton("📂  LÄGG TILL SPEL", this::pickGames);
                  addButton("💾  VÄLJ USB / MINNESKORT", this::pickFolder);
                  addButton("🕹  KONSOLER", this::showConsoles);
                  addButton("🎛  TESTA HANDKONTROLL", this::showController);
                  addButton("⚙  INSTÄLLNINGAR", this::showSettings);

                  addNote("Sparade spel: " + games.size());
                  addNote("Anslut Bluetooth-handkontrollen via Androids Bluetooth-inställningar.");
                  addNote("Obs: emulator krävs för att faktiskt starta ett spel.");
                  body.getChildAt(0).requestFocus();
              }

              private void showLibrary() {
                  setup("Spelbibliotek", "Spel du har lagt till på den här enheten");

                  addButton("＋  Lägg till spel", this::pickGames);
                  addButton("←  Tillbaka", this::showHome);

                  if (games.isEmpty()) {
                      addNote("Inga spel har lagts till ännu.");
                      addNote("Välj Lägg till spel och markera dina egna ROM-filer.");
                  } else {
                      for (int i = 0; i < games.size(); i++) {
                          final int index = i;
                          addButton("🎮  " + gameNames.get(i), () -> showGame(index));
                      }
                  }
              }

              private void showGame(int index) {
                  setup(gameNames.get(index), "Spelfil vald");
                  addNote("Plats: " + games.get(index).toString());
                  addNote("Den här versionen har ännu ingen inbyggd emulator.");
                  addNote("För att spela krävs en kompatibel emulator som kan öppna filen.");
                  addButton("←  Tillbaka till bibliotek", this::showLibrary);
              }

              private void pickGames() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.setType("*/*");
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(i, PICK_GAMES);
              }

              private void pickFolder() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  startActivityForResult(i, PICK_FOLDER);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (resultCode != RESULT_OK || data == null) return;

                  if (requestCode == PICK_GAMES) {
                      if (data.getClipData() != null) {
                          for (int n = 0; n < data.getClipData().getItemCount(); n++) {
                              addGame(data.getClipData().getItemAt(n).getUri());
                          }
                      } else if (data.getData() != null) {
                          addGame(data.getData());
                      }
                      showLibrary();
                  } else if (requestCode == PICK_FOLDER) {
                      Uri folder = data.getData();
                      if (folder != null) {
                          try {
                              getContentResolver().takePersistableUriPermission(
                                  folder, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          } catch (Exception ignored) { }
                          setup("USB / minneskort", "Vald mapp");
                          addNote(folder.toString());
                          addNote("Mappen är vald. Automatisk genomsökning av spel är inte implementerad ännu.");
                          addButton("←  Tillbaka", this::showHome);
                      }
                  }
              }

              private void addGame(Uri uri) {
                  if (uri == null || games.contains(uri)) return;
                  try {
                      getContentResolver().takePersistableUriPermission(
                          uri, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  } catch (Exception ignored) { }
                  games.add(uri);
                  String name = uri.getLastPathSegment();
                  if (name == null || name.isEmpty()) name = "Spel " + games.size();
                  int slash = name.lastIndexOf('/');
                  if (slash >= 0) name = name.substring(slash + 1);
                  gameNames.add(name);
              }

              private void showConsoles() {
                  setup("Konsoler", "System som appen är tänkt att stödja");

                  String[] consoles = {
                      "Nintendo Entertainment System (NES)",
                      "Super Nintendo (SNES)",
                      "Nintendo 64",
                      "Game Boy / Game Boy Color",
                      "Game Boy Advance",
                      "Nintendo DS",
                      "Sega Master System",
                      "Sega Mega Drive / Genesis",
                      "Sega Saturn",
                      "PlayStation",
                      "PlayStation 2",
                      "PlayStation Portable (PSP)",
                      "Arcade / MAME",
                      "Atari",
                      "Commodore 64"
                  };

                  for (String console : consoles) addNote("•  " + console);

                  addNote("Listan visar planerat stöd, inte färdiga emulatorer.");
                  addButton("←  Tillbaka", this::showHome);
              }

              private void showController() {
                  setup("Handkontroll", "Anslut kontrollen via Inställningar på din TV");

                  addNote("Du kan prova styrkorset, OK, BACK och spelknapparna.");
                  TextView status = text("Tryck på en knapp på kontrollen …", 18, MINT);
                  status.setPadding(0, dp(14), 0, dp(14));
                  body.addView(status);

                  View.OnKeyListener listener = (v, keyCode, event) -> {
                      if (event.getAction() == KeyEvent.ACTION_DOWN) {
                          status.setText("Knapp registrerad: " + KeyEvent.keyCodeToString(keyCode));
                          return true;
                      }
                      return false;
                  };
                  status.setFocusable(true);
                  status.setOnKeyListener(listener);
                  status.requestFocus();

                  addButton("←  Tillbaka", this::showHome);
              }

              private void showSettings() {
                  setup("Inställningar", "Grundläggande information");

                  addNote("App: RetroPUSBTV");
                  addNote("Version: 1.0");
                  addNote("Styrning: TV-fjärrkontroll och Android-kompatibla kontroller.");
                  addNote("Spel: använd endast spel och BIOS-filer du har rätt att använda.");
                  addNote("USB: välj lagring via Androids filväljare.");
                  addNote("Emulatorer och automatisk spelskanning behöver byggas till.");
                  addButton("←  Tillbaka", this::showHome);
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      showHome();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroPUSBTV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14