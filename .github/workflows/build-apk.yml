
name: Build RetroPUSBTV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare project and logo
        shell: bash
        run: |
          set -e
          LOGO="a_stylized_neon_glow_futuristic_app_icon_logo_st.png"
          test -f "$LOGO" || { echo "Logo not found: $LOGO"; exit 1; }

          mkdir -p app/src/main/java/com/retropusbtv
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp "$LOGO" app/src/main/res/drawable-nodpi/retropusbtv_logo.png

          sudo apt-get update && sudo apt-get install -y python3-pil
          python3 - <<'PY'
          from PIL import Image, ImageOps
          import os

          source = Image.open(
              "a_stylized_neon_glow_futuristic_app_icon_logo_st.png"
          ).convert("RGBA")

          # Keep the complete artwork inside the square icon.
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              canvas = Image.new("RGBA", (size, size), (15, 18, 30, 255))
              art = ImageOps.contain(source, (int(size * .88), int(size * .88)))
              canvas.alpha_composite(
                  art, ((size - art.width) // 2, (size - art.height) // 2)
              )
              canvas.save(
                  f"app/src/main/res/{folder}/ic_launcher.png"
              )
          PY

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RetroPUSBTV"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.retropusbtv'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.retropusbtv'
                  minSdk 23
                  targetSdk 28
                  versionCode 3
                  versionName '0.3'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature
                  android:name="android.software.leanback"
                  android:required="false" />
              <uses-feature
                  android:name="android.hardware.gamepad"
                  android:required="false" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="RetroPUSBTV"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:banner="@drawable/banner"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#52EBC2</item>
                  <item name="android:windowBackground">#0F121E</item>
                  <item name="android:navigationBarColor">#0F121E</item>
                  <item name="android:statusBarColor">#0F121E</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/banner.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#0F121E"/>
              <corners android:radius="8dp"/>
          </shape>
          EOF

          cat > app/src/main/java/com/retropusbtv/MainActivity.java <<'EOF'
          package com.retropusbtv;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.provider.OpenableColumns;
          import android.view.*;
          import android.widget.*;
          import java.util.*;

          public class MainActivity extends Activity {
              private final int BG = Color.rgb(15,18,30);
              private final int PANEL = Color.rgb(28,34,52);
              private final int MINT = Color.rgb(82,235,194);
              private final int WHITE = Color.WHITE;
              private final int MUTED = Color.rgb(165,176,196);

              private final ArrayList<Uri> uris = new ArrayList<>();
              private final ArrayList<String> names = new ArrayList<>();
              private LinearLayout body;
              private String page = "home";
              private TextView controllerStatus;
              private static final int PICK_FILES = 101;
              private static final int PICK_FOLDER = 102;

              private final String[] consoles = {
                  "Nintendo Entertainment System (NES)",
                  "Super Nintendo (SNES)",
                  "Nintendo 64",
                  "Game Boy / Game Boy Color",
                  "Game Boy Advance",
                  "Nintendo DS",
                  "Sega Master System",
                  "Sega Mega Drive / Genesis",
                  "Sega Saturn",
                  "PlayStation",
                  "PlayStation 2",
                  "PlayStation Portable (PSP)",
                  "Arcade / MAME",
                  "Atari",
                  "Commodore 64"
              };

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);
                  loadGames();
                  showPage("home");
              }

              private int dp(float n) {
                  return (int)(n * getResources().getDisplayMetrics().density + .5f);
              }

              private TextView text(String s, int size, int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER_VERTICAL);
                  return t;
              }

              private LinearLayout column() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  return l;
              }

              private void button(String label, Runnable action) {
                  TextView t = text(label, 18, WHITE);
                  t.setPadding(dp(16), dp(13), dp(16), dp(13));
                  t.setBackgroundColor(PANEL);
                  t.setFocusable(true);
                  t.setClickable(true);
                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(-1, -2);
                  p.bottomMargin = dp(8);
                  body.addView(t, p);
                  t.setOnFocusChangeListener((v, focused) -> {
                      t.setBackgroundColor(focused ? MINT : PANEL);
                      t.setTextColor(focused ? BG : WHITE);
                  });
                  t.setOnClickListener(v -> action.run());
              }

              private void heading(String title, String description) {
                  TextView h = text(title, 26, WHITE);
                  h.setTypeface(null, Typeface.BOLD);
                  body.addView(h);
                  TextView d = text(description, 14, MUTED);
                  d.setPadding(0, dp(5), 0, dp(14));
                  body.addView(d);
              }

              private void note(String s) {
                  TextView t = text(s, 14, MUTED);
                  t.setPadding(dp(4), dp(12), dp(4), dp(12));
                  body.addView(t);
              }

              private void showPage(String next) {
                  page = next;
                  LinearLayout root = column();
                  root.setBackgroundColor(BG);
                  root.setPadding(dp(18), dp(14), dp(18), dp(12));

                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);

                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.retropusbtv_logo);
                  logo.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  header.addView(logo, new LinearLayout.LayoutParams(dp(72), dp(72)));

                  TextView brand = text("RETRO PUSBTV", 24, MINT);
                  brand.setTypeface(null, Typeface.BOLD);
                  brand.setPadding(dp(12), 0, 0, 0);
                  header.addView(brand, new LinearLayout.LayoutParams(0, -2, 1));

                  TextView version = text("0.3", 12, MUTED);
                  header.addView(version);
                  root.addView(header);

                  TextView divider = text(
                      "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━", 12, MINT);
                  root.addView(divider);

                  ScrollView scroll = new ScrollView(this);
                  body = column();
                  body.setPadding(0, dp(12), 0, dp(12));
                  scroll.setFillViewport(true);
                  scroll.addView(body);
                  root.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1));

                  root.addView(text(
                      "PIL UPP/NER • OK/VÄLJ • BACK/TILLBAKA", 11, MUTED));
                  setContentView(root);

                  switch (next) {
                      case "home": home(); break;
                      case "library": library(); break;
                      case "add": addPage(); break;
                      case "consoles": consolePage(); break;
                      case "usb": usbPage(); break;
                      case "controllers": controllerPage(); break;
                      case "settings": settingsPage(); break;
                      case "about": aboutPage(); break;
                      default: home();
                  }
              }

              private void home() {
                  heading("DIN SPELVÄRLD",
                      "Retrospel samlade på ett ställe.");
                  ImageView hero = new ImageView(this);
                  hero.setImageResource(R.drawable.retropusbtv_logo);
                  hero.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  LinearLayout.LayoutParams hp =
                      new LinearLayout.LayoutParams(-1, dp(180));
                  hp.bottomMargin = dp(10);
                  body.addView(hero, hp);

                  button("▶   Spelbibliotek (" + names.size() + ")",
                      () -> showPage("library"));
                  button("＋   Lägg till spel", () -> showPage("add"));
                  button("▦   Konsoler och format", () -> showPage("consoles"));
                  button("▤   USB och minneskort", () -> showPage("usb"));
                  button("⌘   Handkontroller", () -> showPage("controllers"));
                  button("⚙   Inställningar", () -> showPage("settings"));
                  note("Testversion: spelstart och emulatorer måste integreras separat.");
              }

              private void library() {
                  heading("SPELBIBLIOTEK", names.size() + " sparade filer.");
                  if (names.isEmpty()) {
                      note("Biblioteket är tomt. Välj Lägg till spel för att importera ROM-filer.");
                  }
                  for (int i = 0; i < names.size(); i++) {
                      final int index = i;
                      button("🎮  " + names.get(i), () ->
                          new AlertDialog.Builder(this)
                              .setTitle(names.get(index))
                              .setMessage("Filen är sparad i biblioteket. " +
                                  "En kompatibel emulator krävs för att starta spelet.")
                              .setPositiveButton("OK", null)
                              .setNeutralButton("Ta bort", (d,w) -> {
                                  names.remove(index);
                                  uris.remove(index);
                                  saveGames();
                                  showPage("library");
                              }).show());
                  }
                  button("＋  Lägg till filer", this::pickFiles);
                  button("←  Startsidan", () -> showPage("home"));
              }

              private void addPage() {
                  heading("LÄGG TILL SPEL", "Välj spel eller en lagringsmapp.");
                  button("📂  Välj ROM-filer", this::pickFiles);
                  button("🗂  Välj USB-/SD-mapp", this::pickFolder);
                  note("Använd Androids filväljare. Välj bara filer du har rätt att använda.");
                  button("←  Startsidan", () -> showPage("home"));
              }

              private void pickFiles() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION |
                      Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  startActivityForResult(i, PICK_FILES);
              }

              private void pickFolder() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION |
                      Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  startActivityForResult(i, PICK_FOLDER);
              }

              @Override protected void onActivityResult(int request, int result, Intent data) {
                  super.onActivityResult(request, result, data);
                  if (result != RESULT_OK || data == null) return;

                  if (request == PICK_FILES) {
                      if (data.getClipData() != null) {
                          for (int i = 0; i < data.getClipData().getItemCount(); i++)
                              addGame(data.getClipData().getItemAt(i).getUri());
                      } else if (data.getData() != null) {
                          addGame(data.getData());
                      }
                      saveGames();
                      showPage("library");
                  } else if (request == PICK_FOLDER) {
                      try {
                          getContentResolver().takePersistableUriPermission(
                              data.getData(), Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } catch (Exception ignored) {}
                      new AlertDialog.Builder(this)
                          .setTitle("Mapp vald")
                          .setMessage("Mappen har valts. Automatisk skanning är inte implementerad ännu.")
                          .setPositiveButton("OK", (d,w) -> showPage("usb"))
                          .show();
                  }
              }

              private void addGame(Uri uri) {
                  if (uris.contains(uri)) return;
                  uris.add(uri);
                  String name = uri.getLastPathSegment();
                  Cursor c = null;
                  try {
                      c = getContentResolver().query(uri, null, null, null, null);
                      if (c != null && c.moveToFirst()) {
                          int ix = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (ix >= 0) name = c.getString(ix);
                      }
                  } catch (Exception ignored) {
                  } finally {
                      if (c != null) c.close();
                  }
                  names.add(name == null ? "Okänd fil" : name);
                  try {
                      getContentResolver().takePersistableUriPermission(
                          uri, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  } catch (Exception ignored) {}
              }

              private void saveGames() {
                  StringBuilder u = new StringBuilder();
                  StringBuilder n = new StringBuilder();
                  for (int i = 0; i < uris.size(); i++) {
                      if (i > 0) { u.append("\n"); n.append("\n"); }
                      u.append(Uri.encode(uris.get(i).toString()));
                      n.append(Uri.encode(names.get(i)));
                  }
                  getSharedPreferences("library", MODE_PRIVATE).edit()
                      .putString("uris", u.toString())
                      .putString("names", n.toString()).apply();
              }

              private void loadGames() {
                  String u = getSharedPreferences("library", MODE_PRIVATE)
                      .getString("uris", "");
                  String n = getSharedPreferences("library", MODE_PRIVATE)
                      .getString("names", "");
                  if (u.isEmpty() || n.isEmpty()) return;
                  String[] us = u.split("\n");
                  String[] ns = n.split("\n");
                  for (int i = 0; i < Math.min(us.length, ns.length); i++) {
                      try {
                          uris.add(Uri.parse(Uri.decode(us[i])));
                          names.add(Uri.decode(ns[i]));
                      } catch (Exception ignored) {}
                  }
              }

              private void consolePage() {
                  heading("KONSOLER", "Planerade kategorier i biblioteket.");
                  for (String console : consoles) {
                      button("▸  " + console, () ->
                          new AlertDialog.Builder(this)
                              .setTitle(console)
                              .setMessage("Emulator och kompatibla format måste integreras innan spel kan startas.")
                              .setPositiveButton("OK", null).show());
                  }
                  button("←  Startsidan", () -> showPage("home"));
              }

              private void usbPage() {
                  heading("USB OCH MINNESKORT", "Öppna lagring med Androids filväljare.");
                  button("🗂  Välj USB-/SD-mapp", this::pickFolder);
                  button("📂  Välj spel från lagring", this::pickFiles);
                  note("Stöd beror på enhet och filsystem. Automatisk diskskanning finns inte ännu.");
                  button("←  Startsidan", () -> showPage("home"));
              }

              private void controllerPage() {
                  heading("HANDKONTROLLER", "Testa knappar från en kompatibel kontroll.");
                  controllerStatus = text("Tryck på en knapp på kontrollen …", 18, MINT);
                  controllerStatus.setGravity(Gravity.CENTER);
                  controllerStatus.setFocusable(true);
                  controllerStatus.setFocusableInTouchMode(true);
                  controllerStatus.setBackgroundColor(PANEL);
                  body.addView(controllerStatus,
                      new LinearLayout.LayoutParams(-1, dp(110)));

                  controllerStatus.setOnKeyListener((v,key,event) -> {
                      if (event.getAction() == KeyEvent.ACTION_DOWN) {
                          controllerStatus.setText("Knapp: " +
                              KeyEvent.keyCodeToString(key) + "\nKod: " + key);
                          return true;
                      }
                      return false;
                  });
                  note("Para Bluetooth-kontrollen i Androids inställningar först.");
                  button("Testa igen", () -> {
                      controllerStatus.setText("Tryck på en knapp på kontrollen …");
                      controllerStatus.requestFocus();
                  });
                  button("←  Startsidan", () -> showPage("home"));
              }

              private void settingsPage() {
                  heading("INSTÄLLNINGAR", "Grundinställningar.");
                  button("Rensa spellistan", () ->
                      new AlertDialog.Builder(this)
                          .setTitle("Rensa biblioteket?")
                          .setMessage("Filerna på USB eller minneskort raderas inte.")
                          .setNegativeButton("Avbryt", null)
                          .setPositiveButton("Rensa", (d,w) -> {
                              uris.clear();
                              names.clear();
                              saveGames();
                              showPage("settings");
                          }).show());
                  button("Om appen", () -> showPage("about"));
                  button("←  Startsidan", () -> showPage("home"));
              }

              private void aboutPage() {
                  heading("OM RETROPUSBTV", "Version 0.3 – testbygge.");
                  note("Ingår: logga, appikon, menyer, bibliotek, filval, USB-/SD-mappval, konsollista och enkel handkontrolltest.");
                  note("Återstår: emulatorer/spelkärnor, faktisk spelstart, automatisk ROM-skanning, omslag och full kontrollmappning.");
                  button("←  Startsidan", () -> showPage("home"));
              }

              @Override public boolean onKeyDown(int key, KeyEvent event) {
                  if (key == KeyEvent.KEYCODE_BACK && !page.equals("home")) {
                      showPage("home");
                      return true;
                  }
                  return super.onKeyDown(key, event);
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroPUSBTV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
